[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ncm-doc-mcp"
version = "1.0.0"
description = "Fast non-autoregressive code documentation MCP using fine-tuned Stanford NCM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "torch>=2.2.0",
    "numpy",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "transformers>=4.38.0",
    "huggingface-hub>=0.20.0",
    "datasets>=2.16.0",
    "pyyaml"
]

[project.scripts]
ncm-doc-server = "ncm_doc_server:main"

[tool.setuptools]
py-modules = ["ncm_doc_server", "finetune_ncm", "evaluate"]
packages = ["models", "tokenization", "utils", "evaluation", "scripts"]
